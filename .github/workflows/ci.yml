name: Testes de análise estática
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes offline
        run: python -m unittest discover -s tests -v
