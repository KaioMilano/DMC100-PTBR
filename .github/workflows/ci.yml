name: Testes de análise estática
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Executar testes offline
        run: python -m unittest discover -s tests -v
  simulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - name: Testar catálogo e modelo de renderização
        run: npm test
      - name: Preparar Chromium para testes locais de arquivo
        run: npx playwright install --with-deps chromium
      - name: Testar interface offline no navegador
        run: npm run test:browser
