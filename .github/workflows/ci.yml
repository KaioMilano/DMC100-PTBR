name: Testes de análise estática
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Executar testes offline
        run: python -m unittest discover -s tests -v
  simulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - name: Testar catálogo e modelo de renderização
        run: npm test
      - name: Preparar Chromium para testes locais de arquivo
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar e extrair pacote visual autoral
        working-directory: ${{ github.workspace }}
        run: |
          python -m src.dmc100_ptbr.preview_package "$RUNNER_TEMP/dmc-preview.zip"
          python -m zipfile -e "$RUNNER_TEMP/dmc-preview.zip" "$RUNNER_TEMP/dmc-preview"
      - name: Testar pacote extraído offline no navegador
        env:
          DMC_PREVIEW_ROOT: ${{ runner.temp }}/dmc-preview/simulator
        run: npm run test:browser
  arm-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramentas opcionais de CPU virtual
        run: python -m pip install -r requirements-arm.txt
      - name: Executar dispatcher autoral em ARM com dados sintéticos
        run: python -m unittest discover -s tests -p "test_arm*.py" -v
